<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Excel Institute AI Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                🤖
            </div>

            <div>
                <h2>Excel Institute</h2>
                <p>AI Assistant</p>
            </div>

        </div>

        <div class="side-description">
            Your Guide to Excel Group Institutions
        </div>


        <nav class="menu">

            <button class="menu-item active"
                    onclick="showSection('chat')">
                💬
                <span>Chat</span>
            </button>

            <button class="menu-item"
                    onclick="askQuestion('What institutions are available in Excel Group?')">
                🏛️
                <span>Institutions</span>
            </button>

            <button class="menu-item"
                    onclick="askQuestion('What courses are available?')">
                🎓
                <span>Courses</span>
            </button>

            <button class="menu-item"
                    onclick="askQuestion('What is the admission procedure?')">
                📄
                <span>Admissions</span>
            </button>

            <button class="menu-item"
                    onclick="askQuestion('What facilities are available?')">
                ⚙️
                <span>Facilities</span>
            </button>

            <button class="menu-item"
                    onclick="askQuestion('What is the contact information?')">
                📞
                <span>Contact</span>
            </button>

        </nav>


        <div class="sidebar-bottom">

            <div class="graduation-icon">
                🎓
            </div>

            <div>Learn</div>
            <div>Grow</div>
            <div>Achieve</div>

        </div>

    </aside>


    <!-- ================= MAIN CHAT ================= -->

    <main class="chat-panel">

        <!-- HEADER -->

        <header class="chat-header">

            <div class="header-left">

                <div class="header-bot">
                    🤖
                </div>

                <div>
                    <h1>Excel Institute AI Assistant</h1>
                    <p>College Information Chatbot</p>
                </div>

            </div>


            <div class="online">

                <span></span>

                Online

            </div>

        </header>


        <!-- CHAT AREA -->

        <section class="chat-box"
                 id="chat-box">


            <!-- BOT WELCOME MESSAGE -->

            <div class="message-row bot-row">

                <div class="avatar">
                    🤖
                </div>


                <div>

                    <div class="message bot-message">

                        <p>
                            Hello! 👋 Welcome to
                            <strong>Excel Institute.</strong>
                        </p>

                        <p>
                            I can help you with:
                        </p>


                        <div class="quick-buttons">

                            <button onclick="askQuestion('What courses are available?')">
                                🎓 Courses
                            </button>

                            <button onclick="askQuestion('What is the eligibility?')">
                                📄 Eligibility
                            </button>

                            <button onclick="askQuestion('What scholarships are available?')">
                                💰 Scholarship
                            </button>

                            <button onclick="askQuestion('Is hostel available?')">
                                🏠 Hostel
                            </button>

                            <button onclick="askQuestion('What about placement?')">
                                💼 Placement
                            </button>

                            <button onclick="askQuestion('Where is Excel Institute located?')">
                                📍 Location
                            </button>

                        </div>

                    </div>

                    <div class="time">
                        <span id="welcome-time"></span>
                    </div>

                </div>

            </div>

        </section>


        <!-- TYPING -->

        <div id="typing-indicator"
             class="typing">

            <span></span>
            <span></span>
            <span></span>

            <label>AI is thinking...</label>

        </div>


        <!-- INPUT -->

        <div class="input-section">

            <div class="input-wrapper">

                <button class="emoji-button">
                    ☺
                </button>

                <input
                    type="text"
                    id="message"
                    placeholder="Ask anything about Excel Institute..."
                    autocomplete="off"
                >

                <button
                    id="send-btn"
                    onclick="sendMessage()">

                    ➤
                    <span>Send</span>

                </button>

            </div>

        </div>


        <!-- FOOTER -->

        <footer>

            <span>
                🤖 AI-powered college enquiry assistant
            </span>

            <span>
                Excel Institute
            </span>

        </footer>

    </main>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

<script>

    const timeElement =
        document.getElementById("welcome-time");

    const now = new Date();

    timeElement.textContent =
        now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });


    function showSection(section) {

        if (section === "chat") {

            document.getElementById("message").focus();

        }

    }

</script>

</body>
</html>
